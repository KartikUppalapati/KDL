<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>KDL</title>
        <meta charset="utf-8" />
        <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"/> -->
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <!-- ICONS -->
        <link type="text/css" href="plugins/material/css/materialdesignicons.min.css" rel="stylesheet"/>

        <!-- MONO CSS -->
        <link type="text/css" href="index.css" id="main-css-href" rel="stylesheet"/>

        <!-- FAVICON -->
        <!-- <link href="images/favicon.png" rel="shortcut icon"/> -->
    </head>

    <body class="navbar-fixed" id="body">
        <div class="wrapper">
            <div class="page-wrapper">
                <!-- Top Navbar -->
                <header class="main-header" id="header">
                    <nav id="navbar" class="navbar navbar-expand-lg navbar-light">
                        <!-- Message Area -->
                        <div id="serverMessage" class="navbar-left">
                        </div>
                        
                        <!-- Profile Area -->
                        <div class="navbar-right">
                            <button class="nav nav-link button-hover" onclick="deleteSongs()" data-toggle="tooltip" data-placement="right" title="Delete all songs">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-delete"></i></h5>
                            </button>
                            <button class="nav nav-link button-hover" onclick="openCredentialsDialog()" data-toggle="tooltip" data-placement="right" title="Spotify credentials">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-key-variant"></i></h5>
                            </button>
                            <button class="nav nav-link button-hover" onclick="scanSongs()" data-toggle="tooltip" data-placement="right" title="Scan all songs">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-file-find"></i></h5>
                            </button>
                            <button class="nav nav-link button-hover" onclick="saveSongs()" data-toggle="tooltip" data-placement="right" title="Save songs">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-content-save"></i></h5>
                            </button>
                            <button class="nav nav-link button-hover" onclick="exportSongs()" data-toggle="tooltip" data-placement="right" title="Export all songs to a folder (Apple Music by default)">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-folder-move"></i></h5>
                            </button>
                            <!-- Shown once a new KDL version is ready (or available, where it can't install itself) -->
                            <button id="appUpdateButton" class="nav nav-link button-hover" onclick="installAppUpdate()" data-toggle="tooltip" data-placement="right" style="display: none;">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-arrow-up-circle" style="color: #0acb8e;"></i></h5>
                            </button>
                        </div>
                    </nav>
                </header>

                <!-- Main Areas -->
                <div class="content-wrapper">
                    <div class="content">
                        <div id="homeArea">
                            <div class="row">
                                <!-- Left Side -->
                                <div class="col-7">
                                    <!-- Download Area -->
                                    <div class="card card-default">
                                        <div class="card-body">
                                            <div class="input-group mb-0">
                                                <!-- Download -->
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text">
                                                        <i id="downloadLogo" class="mdi mdi-download"></i>
                                                    </span>
                                                </div>

                                                <!-- Link -->
                                                <input id="downloadLink" class="form-control" type="text">

                                                <!-- Stop, only shown while downloading (see setDownloading) -->
                                                <div id="stopDownloadButton" class="input-group-append" style="display: none;">
                                                    <span class="input-group-text button-hover" style="cursor: pointer;" onclick="stopDownload()" title="Stop download">
                                                        <i class="mdi mdi-stop" style="color: var(--danger);"></i>
                                                    </span>
                                                </div>

                                                <!-- Settings -->
                                                <div class="input-group-append">
                                                    <div class="dropdown">
                                                        <p class="dropdown-toggle input-group-text" role="button" id="dropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                                            <i id="settingsLogo" class="mdi mdi-settings"></i>
                                                        </p>
                                
                                                        <div class="dropdown-menu" aria-labelledby="dropdownMenuLink" x-placement="bottom-end" style="position: absolute; transform: translate3d(0px, 40px, 0px); top: 0px; left: 0px; will-change: transform;">
                                                            <!-- Settings are saved between launches, the icons are set by renderSettings() -->
                                                            <h6 class="mt-2 ml-3 mb-2 mr-3 setting-row" onclick="settingsToggle('cutSponsored')" title="Cut sponsored segments and non-music parts (intros, outros, talking) out of videos. Uses SponsorBlock, so only works if someone marked the video">
                                                                cut-sponsored
                                                                <i id="cutSponsoredSetting" class="mdi"></i>
                                                            </h6>
                                                            <h6 class="mt-2 ml-3 mb-2 mr-3 setting-row" onclick="settingsToggle('wholePlaylist')" title="Off: a link with &amp;list= only downloads its one video. On: downloads the whole playlist or mix">
                                                                whole-playlist
                                                                <i id="wholePlaylistSetting" class="mdi"></i>
                                                            </h6>
                                                            <h6 class="mt-2 ml-3 mb-2 mr-3 setting-row" onclick="settingsToggle('noWarnings')" title="Don't show yt-dlp's warnings in the download log">
                                                                no-warnings
                                                                <i id="noWarningsSetting" class="mdi"></i>
                                                            </h6>
                                                            <h6 class="mt-2 ml-3 mb-2 mr-3 setting-row" onclick="settingsToggle('ignoreErrors')" title="Keep going past videos that fail in a playlist">
                                                                ignore-errors
                                                                <i id="ignoreErrorsSetting" class="mdi"></i>
                                                            </h6>
                                                            <h6 class="mt-2 ml-3 mb-2 mr-3 setting-row" onclick="settingsToggle('audioOnly')" title="MP3 instead of MP4 video">
                                                                audio-only
                                                                <i id="audioOnlySetting" class="mdi"></i>
                                                            </h6>
                                                            <h6 id="audioQualityRow" class="mt-2 ml-3 mb-2 mr-3" style="white-space: nowrap;" title="MP3 quality: high ~260 kbps, medium ~140 kbps, low ~75 kbps">
                                                                audio-quality:
                                                                <span class="quality-option" data-quality="high" onclick="setAudioQuality('high')">high</span>
                                                                <span class="quality-option" data-quality="medium" onclick="setAudioQuality('medium')">medium</span>
                                                                <span class="quality-option" data-quality="low" onclick="setAudioQuality('low')">low</span>
                                                            </h6>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Console Log -->
                                            <div class="row mt-3">
                                                <div class="col-12">
                                                    <div id="downloadLogs">
                                                        <p style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Enter youtube link above</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Folder Area -->
                                    <div class="card card-default">
                                        <div class="card-body">
                                            <!-- File List -->
                                            <div class="row mt-3">
                                                <div class="col-12">
                                                    <div id="folderFiles" style="height: 47.5vh; overflow-y: auto;">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Right Side -->
                                <div class="col-5">
                                    <div class="card card-default">
                                        <div class="card-body mt-1">
                                            <!-- Song Metadata -->
                                            <div class="row">
                                                <!-- Album Image -->
                                                <div class="col-4">
                                                    <div>
                                                        <img id="spotifyImage" src="" width="140" height="140">
                                                    </div>
                                                </div>

                                                <!-- Title, Artist, Album -->
                                                <div class="col-8">
                                                    <div class="card-default">
                                                        <!-- Title -->
                                                        <div class="input-group mb-1">
                                                            <div class="input-group-prepend">
                                                                <span class="input-group-text">
                                                                    <i class="mdi mdi-music"></i>
                                                                </span>
                                                            </div>
                                                            <input id="spotifyTitle" class="form-control" type="text">
                                                        </div>

                                                        <!-- Artist -->
                                                        <div class="input-group mb-1">
                                                            <div class="input-group-prepend">
                                                                <span class="input-group-text">
                                                                    <i class="mdi mdi-account"></i>
                                                                </span>
                                                            </div>
                                                            <input id="spotifyArtist" class="form-control" type="text">
                                                        </div>

                                                        <!-- Album -->
                                                        <div class="input-group mb-1">
                                                            <div class="input-group-prepend">
                                                                <span class="input-group-text">
                                                                    <i class="mdi mdi-album"></i>
                                                                </span>
                                                            </div>
                                                            <input id="spotifyAlbum" class="form-control" type="text">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Spotify Search -->
                                            <div class="input-group mb-0">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text">
                                                        <i id="spotifyLogo" class="mdi mdi-spotify"></i>
                                                    </span>
                                                </div>
                                                <input id="spotifySearch" class="form-control"  type="text">
                                            </div>

                                            <!-- Spotify Results -->
                                            <div class="row mt-3 mb-3">
                                                <div class="col-12">
                                                    <div id="spotifyResults" style="height: 37vh; overflow-y: auto;">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Confirm modal, filled in and opened by confirmDialog() -->
        <div id="confirmDialog" class="dialog-backdrop" style="display: none;">
            <div class="card card-default dialog-card">
                <div class="card-body">
                    <h5 id="confirmDialogTitle" class="mb-2"></h5>
                    <p id="confirmDialogText" class="mb-3" style="font-size: 13px;"></p>
                    <div style="display: flex; justify-content: flex-end; gap: 8px;">
                        <button id="confirmDialogCancel" class="btn btn-light">Cancel</button>
                        <button id="confirmDialogConfirm" class="btn btn-danger"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export modal (export button). Clicking the folder picks a different one, and it's remembered -->
        <div id="exportDialog" class="dialog-backdrop" style="display: none;" onclick="if (event.target == this) closeExportDialog()">
            <div class="card card-default dialog-card">
                <div class="card-body">
                    <h5 class="mb-2">Export songs</h5>
                    <p id="exportDialogText" class="mb-3" style="font-size: 13px;"></p>

                    <div class="input-group mb-1 export-folder" onclick="chooseExportFolder()">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="mdi mdi-folder"></i>
                            </span>
                        </div>
                        <!-- Cut off at the start, so the end of the path (where it goes) stays visible -->
                        <div class="form-control export-folder-path"><bdi id="exportFolderPath"></bdi></div>
                    </div>

                    <p id="exportDialogStatus" class="mt-2 mb-2" style="font-size: 13px; min-height: 20px;"></p>

                    <div style="display: flex; justify-content: flex-end; gap: 8px;">
                        <button class="btn btn-light" onclick="closeExportDialog()">Cancel</button>
                        <button id="exportDialogExport" class="btn btn-primary" onclick="confirmExport()">Export</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Spotify credentials modal -->
        <div id="credentialsDialog" class="dialog-backdrop" style="display: none;" onclick="if (event.target == this) closeCredentialsDialog()">
            <div class="card card-default dialog-card">
                <div class="card-body">
                    <h5 class="mb-2">Spotify credentials</h5>
                    <p class="mb-3" style="font-size: 13px;">
                        Create an app in the <a href="#" onclick="openSpotifyDashboard(); return false;">Spotify developer dashboard</a>
                        and paste its Client ID and Client Secret here. They're only saved on this computer.
                    </p>

                    <!-- Client ID -->
                    <div class="input-group mb-1">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="mdi mdi-account-key"></i>
                            </span>
                        </div>
                        <input id="credentialsClientId" class="form-control" type="text" placeholder="Client ID" spellcheck="false">
                    </div>

                    <!-- Client Secret, hidden unless the eye is clicked -->
                    <div class="input-group mb-1">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="mdi mdi-lock"></i>
                            </span>
                        </div>
                        <input id="credentialsClientSecret" class="form-control" type="password" placeholder="Client Secret" spellcheck="false">
                        <div class="input-group-append">
                            <span class="input-group-text" style="cursor: pointer;" onclick="toggleSecretVisible()" title="Show/hide">
                                <i id="credentialsSecretEye" class="mdi mdi-eye"></i>
                            </span>
                        </div>
                    </div>

                    <p id="credentialsStatus" class="mt-2 mb-2" style="font-size: 13px; min-height: 20px;"></p>

                    <div style="display: flex; justify-content: flex-end; gap: 8px;">
                        <button class="btn btn-light" onclick="closeCredentialsDialog()">Cancel</button>
                        <button id="credentialsSaveButton" class="btn btn-primary" onclick="saveCredentials()">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script>
        // Init stuff
        var msgDivMsg = null;
        var asyncFunctionTimeout = 200;
        var currentDashboard = "homeArea";
        var ipc = require("electron").ipcRenderer;
        var currentProfileButton = "profileInfoButton";
        var folderFiles = document.getElementById("folderFiles");
        var downloadLink = document.getElementById("downloadLink");
        var downloadLogs = document.getElementById("downloadLogs");
        var spotifyImage = document.getElementById("spotifyImage");
        var spotifyTitle = document.getElementById("spotifyTitle");
        var spotifyAlbum = document.getElementById("spotifyAlbum");
        var spotifyArtist = document.getElementById("spotifyArtist");
        var spotifySearch = document.getElementById("spotifySearch");
        var spotifyResults = document.getElementById("spotifyResults");
        var dropdownToggle = document.querySelector('.dropdown-toggle');
        var dropdownMenu = document.querySelector('.dropdown-menu');

        // "1 song" / "2 songs"
        function songCount(count)
        {
            return count + (count == 1 ? " song" : " songs");
        }

        // Escape text before putting it in html
        function escapeHtml(text)
        {
            return String(text ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
        }

        // Words that mark a different version of a song, kept in searches so e.g. a remix finds the remix
        var versionWords = "remix|live|acoustic|unplugged|sped up|slowed|reverb|nightcore|instrumental|karaoke|cover|demo|radio edit|extended|version|edit|mix";

        // Which version words a name has, e.g. "remix" or "karaoke version", "" for none
        function getVersion(text)
        {
            var found = (text.match(new RegExp(`\\b(${versionWords})\\b`, "gi")) || []).map(word => word.toLowerCase());
            return [...new Set(found)].sort().join(" ");
        }

        // Words that only describe the upload (official video, lyrics, HD...)
        var junkWords = "official|music|lyrics?|visuali[sz]er|audio|video|clip|hd|hq|4k|explicit|remaster(ed)?";

        // Clean song file name for spotify search
        function cleanSongName(fileName)
        {
            // Drop extension, undo yt-dlp's full width characters (｜ ＂ ？) and make quotes, dashes and brackets plain.
            // 「」 『』 are quotes around a Japanese song title, so they're dropped but their text is kept
            var cleanedSongName = fileName.replace(/\.[^.]+$/, "").normalize("NFKC")
                .replace(/⧸/g, "/")
                .replace(/[\[{【〔]/g, "(").replace(/[\]}】〕]/g, ")")
                .replace(/[“”„«»"「」『』]/g, " ").replace(/[‘’]/g, "'")
                .replace(/\s[–—]\s/g, " - ");

            // Anything after " | " or " // " is a description, not the song
            cleanedSongName = cleanedSongName.replace(/\s(\||\/\/)\s.*$/, "");

            // Replace (...) groups innermost first, keeping only version words from them
            var previous;
            do
            {
                previous = cleanedSongName;
                cleanedSongName = cleanedSongName.replace(/\(([^()]*)\)/g, (group, inside) =>
                    " " + (inside.match(new RegExp(`\\b(${versionWords})\\b`, "gi")) || []).join(" ") + " ");
            }
            while (cleanedSongName != previous);
            cleanedSongName = cleanedSongName.replace(/[()]/g, " ");

            // Featured artists outside brackets, up to the next " - " or the end
            cleanedSongName = cleanedSongName.replace(/\s(ft\.?|feat\.?|featuring)\s.*?(?=\s-\s|$)/i, " ");

            // Junk words at the end ("... OFFICIAL VIDEO"). A single word only if it can't be the song's name ("Music", "Video Games")
            var trailingJunk = cleanedSongName.match(new RegExp(`(\\s-)?(\\s+(${junkWords}))+\\s*$`, "i"));
            if (trailingJunk && (trailingJunk[0].trim().split(/\s+/).filter(word => word != "-").length > 1 || /^(official|lyrics?|hd|hq|4k)$/i.test(trailingJunk[0].trim())))
            {
                cleanedSongName = cleanedSongName.slice(0, trailingJunk.index);
            }

            // Collab separators (lowercase x only, so "Lil Nas X" stays), artist - title dash, emojis
            return cleanedSongName
                .replace(/\sx\s/g, " ").replace(/\s(&|vs\.?)\s/gi, " ").replace(/,\s/g, " ")
                .replace(/\s-(\s|$)/g, " ")
                .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
                .replace(/\s+/g, " ").trim();
        }

        // Split text into plain lowercase words (no accents or punctuation) for comparing names
        function toWords(text)
        {
            return text.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
                .replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
        }

        // Pick the result whose title and artist best match the search and whose version (remix, live...) agrees with it.
        // Ties go to Spotify's order. Names with no latin words (e.g. Japanese) just score by order.
        // Returns { track, confident }, confident only when the whole title, an artist and the version all match
        function pickBestTrack(search, tracks)
        {
            var searchWords = new Set(toWords(search));
            var wantedVersion = getVersion(search);
            var best = { track: null, confident: false };
            var bestScore = -Infinity;

            tracks.forEach((track, rank) =>
            {
                // Title without "(feat. ...)" or "- Remix" parts, those are checked separately
                var titleWords = toWords(track.name.replace(/\(.*?\)|\[.*?\]|\s-\s.*$/g, ""));
                var titleMatch = titleWords.filter(word => searchWords.has(word)).length / Math.max(titleWords.length, 1);
                var artistMatch = track.artists.some(artist => toWords(artist.name).some(word => searchWords.has(word))) ? 1 : 0;
                var versionMismatch = getVersion(track.name) != wantedVersion ? 1 : 0;

                var score = titleMatch * 2 + artistMatch - versionMismatch - rank * 0.05;
                if (score > bestScore)
                {
                    bestScore = score;

                    // No title words means it couldn't be checked (e.g. a Japanese title), so not confident either
                    var confident = titleWords.length > 0 && titleMatch == 1 && artistMatch == 1 && versionMismatch == 0;
                    best = { track, confident };
                }
            });

            return best;
        }

        // Settings dropdown menu logic
        if (dropdownToggle && dropdownMenu)
        {
            dropdownMenu.style.display = 'none';

            dropdownToggle.addEventListener('click', function (event)
            {
                event.stopPropagation();
                var isVisible = window.getComputedStyle(dropdownMenu).display !== 'none';

                if (isVisible)
                {
                    dropdownMenu.style.display = 'none';
                    dropdownMenu.classList.remove('show');
                    dropdownToggle.setAttribute('aria-expanded', 'false');
                }
                else
                {
                    dropdownMenu.style.display = 'block';
                    dropdownMenu.classList.add('show');
                    dropdownToggle.setAttribute('aria-expanded', 'true');
                }
            });

            document.addEventListener('click', function (event)
            {
                if (!event.target.closest('.dropdown'))
                {
                    dropdownMenu.style.display = 'none';
                    dropdownMenu.classList.remove('show');
                    dropdownToggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        // On page load
        ipc.send("getFilesInFolder", {});

        // Hide spotify image initially
        spotifyImage.style.visibility = "hidden";

        // Display success message
        function successMessage(text)
        {
            // Create divs
            var msgDiv = document.getElementById("serverMessage");
            var msg = document.createElement("div");
            msg.setAttribute("class", "successMessage");
            msg.appendChild(document.createTextNode("Success! " + text));
            msg.title = "Success! " + text;
            
            // Remove prev message
            try
            {
                msgDiv.removeChild(msgDivMsg);
            }
            catch (error) {}
            
            msgDiv.appendChild(msg);
            msgDivMsg = msg;

            // Clear message
            setTimeout(function ()
            {
                msgDiv.removeChild(msg);
            }, 1500);
        };

        // Display error message
        function errorMessage(text)
        {
            // Create divs
            var msgDiv = document.getElementById("serverMessage");
            var msg = document.createElement("div");
            msg.setAttribute("class", "errorMessage");
            msg.appendChild(document.createTextNode("Error! " + text));
            msg.title = "Error! " + text;

            // Remove prev message
            try
            {
                msgDiv.removeChild(msgDivMsg);
            }
            catch (error) {}
            
            msgDiv.appendChild(msg);
            msgDivMsg = msg;

            // Clear message
            setTimeout(function ()
            {
                msgDiv.removeChild(msg);
            }, 1500);
        };

        // A song's row (the div holding its metadata) by file name, or null if it isn't in the list
        function findFileRow(fileName)
        {
            for (let i = 0; i < folderFiles.children.length; i++)
            {
                var songDiv = folderFiles.children[i].children[1];
                if (songDiv.getAttribute("data-file-name") == fileName)
                {
                    return songDiv;
                }
            }
            return null;
        }

        // Add a file to the end of the list, unless it's already there. Returns whether it was added.
        // insertAdjacentHTML leaves the other rows (and their scanned metadata) untouched
        function addFileRow(fileName)
        {
            if (findFileRow(fileName))
            {
                return false;
            }

            // Clicking anywhere on a song searches spotify for it (the copy button stops its click from also doing that).
            // Dragging it drags the real file out of the app
            folderFiles.insertAdjacentHTML("beforeend",
            `<div class="mb-3 button-hover" onclick="searchSong(this.children[1])" draggable="true" ondragstart="dragSongOut(event, this)" style="cursor: pointer; position: relative; padding-right: 40px;">
                <div style="white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                    <i class="save-status mdi" style="display: none;"></i>
                    <i class="match-unsure mdi mdi-help-circle" style="display: none; color: var(--warning);"
                    title="Unsure match, click the song to check it"></i>
                    ${escapeHtml(fileName)}
                </div>
                <div class="row" data-file-name="${escapeHtml(fileName)}"
                data-song-image="" data-song-title="" data-song-artist="" data-song-album="">
                    <div style="padding-left: 15px;">
                        <!-- Play/pause over the cover, its click doesn't also search spotify -->
                        <div class="song-cover" onclick="event.stopPropagation(); togglePlay(this.closest('.row'))" title="Play a 15s preview">
                            <img src="" width="65" height="65">
                            <i class="mdi mdi-play song-cover-button"></i>
                            <div class="song-cover-progress"></div>
                        </div>
                    </div>
                    <div class="col" style="min-width: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                        Title: </br>
                        Artist: </br>
                        Album: </br>
                    </div>
                </div>

                <!-- Copy button: far right, centered on the whole song (the padding-right above keeps text out from under it) -->
                <div style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                    <a class="grow" onclick="event.stopPropagation(); copyDataToSong(this.parentElement.parentElement.children[1])">
                        <i class="mdi mdi-content-copy text-primary" style="font-size: 20px;"></i>
                    </a>
                </div>
            </div>`);
            return true;
        }

        // Add any files not shown yet (all of them on page load)
        ipc.on("filesList", function(event, files)
        {
            files.forEach(addFileRow);
        });

        // The songs folder changed outside the app (e.g. files deleted in Finder): remove rows for files that are gone.

        ipc.on("folderChanged", function(event, files)
        {

            [...folderFiles.children].forEach(entry =>
            {
                if (!present.has(entry.children[1].getAttribute("data-file-name")))
                {
                    entry.remove();
                }
            });

        });

        // Show each song as soon as yt-dlp finishes it, and scan it right away.
        // A song that was already in the list (downloaded again) keeps its metadata
        ipc.on("songDownloaded", function(event, fileName)
        {
            // Checked before adding, since the new row makes the list longer.
            // A few px of slack for rounding, and the scroll is instant so a second song never lands mid animation
            var wasAtBottom = folderFiles.scrollHeight - folderFiles.scrollTop - folderFiles.clientHeight <= 5;

            if (addFileRow(fileName))
            {
                scanSong(findFileRow(fileName));

                // Follow along at the bottom, stay put if scrolled up (e.g. fixing a song mid download)

        // Replace the download log's line, optionally colored (e.g. var(--success) or var(--danger))
        function setDownloadLog(text, color = "")
        {
            downloadLogs.innerHTML = `<p style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(text)}</p>`;
            downloadLogs.firstChild.style.color = color;
        }

        // Last error yt-dlp printed, shown with "Download Failed!" since that message replaces it in the log
        var lastDownloadError = "";

        // Replace previous console download output 
        ipc.on("downloadOutput", function(event, output)
        {
            // Remove leading brackets: [download] ...
            var cleaned = output.trim().replace(/^\[.*?\]\s*/, '');

            // Could be empty
            if (cleaned == "")
            {
                return;
            }

            // Error output can come with other lines in the same chunk
            var errorLine = cleaned.split(/\r?\n/).reverse().find(line => line.trim().startsWith("ERROR:"));
            if (errorLine)
            {
                lastDownloadError = errorLine.trim().replace(/^ERROR:\s*(\[.*?\]\s*)?/, "");
            }
            setDownloadLog(cleaned);
        });

        // Songs were added as they finished, this just catches any that were missed (even when some videos failed)
        // Spin the download icon and show the stop button while downloading
        function setDownloading(downloading)

                setDownloadLog("Download Completed!", "var(--success)");

        // Gen html for each song and add to area
        ipc.on("songSearch", function(event, songResultList)

            for (let i = 0; i < songResultList.tracks.items.length; i++)
            {

                {
                    "songName": songResultList.tracks.items[i].name,
                    "albumName": songResultList.tracks.items[i].album.name,
                    "artistName": songResultList.tracks.items[i].artists[0].name,

                }

                spotifyResults.innerHTML +=
                `<div class="row mb-3 button-hover" onclick="selectSong(this)" style="cursor: pointer;"
                data-song-image="${escapeHtml(songMetaData.albumImage)}" data-song-title="${escapeHtml(songMetaData.songName)}"
                data-song-artist="${escapeHtml(songMetaData.artistName)}" data-song-album="${escapeHtml(songMetaData.albumName)}">

        // Update song data
        ipc.on("songScan", function(event, songResults, fileName)
        {
            // Get song div, the file may have been deleted since the scan started
            var songDiv = findFileRow(fileName);
            if (!songDiv)
            {
                return;
            }

            // Use the result that best matches the file name
            var { track, confident } = pickBestTrack(cleanSongName(songDiv.getAttribute("data-file-name")), songResults.tracks?.items || []);
            if (!track)
            {
                errorMessage("No match for " + songDiv.getAttribute("data-file-name"));
                return;
            }
            var songMetaData =
            {
                "songName": track.name,
                "albumName": track.album.name,
                "artistName": track.artists[0].name,
                "albumImage": track.album.images[0]?.url || ""
            }

            // Set song metadata fields
            songDiv.setAttribute("data-song-image", songMetaData.albumImage);
            songDiv.setAttribute("data-song-title", songMetaData.songName);
            songDiv.setAttribute("data-song-artist", songMetaData.artistName);
            songDiv.setAttribute("data-song-album", songMetaData.albumName);
            setSaveStatus(songDiv, "unsaved");
            setMatchUnsure(songDiv, !confident);

            songDiv.children[0].getElementsByTagName("img")[0].src = songMetaData.albumImage;
            songDiv.children[1].innerHTML =
            `Title: ${escapeHtml(songMetaData.songName)}</br>
            Artist: ${escapeHtml(songMetaData.artistName)}</br>
            Album: ${escapeHtml(songMetaData.albumName)}</br>`;
        });

        // Show status message
        // One shared player for the folder list, so starting a song stops the one before.
        // It plays a short preview, starting a third of the way in to skip intros
        var songPlayer = new Audio();
        var playingRow = null;
        var songsFolder = null;
        var previewSeconds = 15;
        var previewStart = 0;
        var previewEnd = 0;

        // Play a song's preview from its row, or pause/resume it if it's the one already loaded
        async function togglePlay(songDiv)
        {
            if (playingRow == songDiv)
            {
                songPlayer.paused ? songPlayer.play() : songPlayer.pause();
                return;
            }

            stopPlayback();
            songsFolder = songsFolder || await ipc.invoke("getSongsFolder");

            // pathToFileURL escapes names with #, ?, spaces etc.
            var filePath = require("path").join(songsFolder, songDiv.getAttribute("data-file-name"));
            songPlayer.src = require("url").pathToFileURL(filePath).href;
            playingRow = songDiv;
        }

        // Once the song's length is known, jump to the preview and play it.
        // Songs too short for a preview from a third in start earlier, ones under 15s play whole
        songPlayer.addEventListener("loadedmetadata", () =>
        {
            if (!playingRow)
            {
                return;
            }
            var duration = songPlayer.duration;
            previewStart = Math.max(0, Math.min(duration / 3, duration - previewSeconds));
            previewEnd = Math.min(duration, previewStart + previewSeconds);
            songPlayer.currentTime = previewStart;
            songPlayer.play().catch(() => {});
        });

        // The mouse is usually still on a cover when it should go back to normal (it was just clicked),
        // so keep its hover button hidden until the mouse leaves
        function hideHoverUntilLeave(cover)
        {
            cover.classList.add("hover-off");
            cover.addEventListener("mouseleave", () => cover.classList.remove("hover-off"), { once: true });
        }

        // Preview over: stop, and put the cover back to normal
        function finishPreview()
        {
            var cover = playingRow.querySelector(".song-cover");
            stopPlayback();
            hideHoverUntilLeave(cover);
        }

        // Stop and unload, so the file isn't held open (Windows can't delete or save over a playing file)
        function stopPlayback()
        {
            // Cleared before redrawing it, so it no longer counts as the loaded song
            var stoppedRow = playingRow;
            playingRow = null;
            clearTimeout(pausedTimeout);
            if (stoppedRow)
            {
                setPlayButton(stoppedRow, false, 0);
            }
            songPlayer.pause();
            songPlayer.removeAttribute("src");
            songPlayer.load();
        }

        // Pause icon while playing, play icon otherwise. The button stays visible for the loaded song (even paused). Progress is 0 to 1
        function setPlayButton(songDiv, playing, progress)
        {
            var cover = songDiv.querySelector(".song-cover");
            cover.classList.toggle("loaded", songDiv == playingRow);
            cover.title = playing ? "Pause" : "Play a 15s preview";
            cover.querySelector(".song-cover-button").className = "mdi song-cover-button " + (playing ? "mdi-pause" : "mdi-play");
            if (progress !== undefined)
            {
                cover.querySelector(".song-cover-progress").style.width = (progress * 100) + "%";
            }
        }

        // A paused song's button goes away after a few seconds (its progress bar stays, and clicking the cover still resumes it)
        var pausedTimeout = null;
        songPlayer.addEventListener("pause", () =>
        {
            if (!playingRow)
            {
                return;
            }
            setPlayButton(playingRow, false);
            clearTimeout(pausedTimeout);
            pausedTimeout = setTimeout(() =>
            {
                if (playingRow && songPlayer.paused)
                {
                    var cover = playingRow.querySelector(".song-cover");
                    cover.classList.remove("loaded");
                    hideHoverUntilLeave(cover);
                }
            }, 3000);
        });
        songPlayer.addEventListener("play", () =>
        {
            clearTimeout(pausedTimeout);
            if (playingRow)
            {
                playingRow.querySelector(".song-cover").classList.remove("hover-off");
                setPlayButton(playingRow, true);
            }
        });
        songPlayer.addEventListener("ended", () => playingRow && finishPreview());

        // Progress is through the preview, not the whole song
        songPlayer.addEventListener("timeupdate", () =>
        {
            if (!playingRow || !songPlayer.duration)
            {
                return;
            }
            if (songPlayer.currentTime >= previewEnd)
            {
                finishPreview();
                return;
            }
            setPlayButton(playingRow, !songPlayer.paused, (songPlayer.currentTime - previewStart) / (previewEnd - previewStart));
        });
        songPlayer.addEventListener("error", () =>
        {
            if (playingRow)

                errorMessage("Couldn't play " + playingRow.getAttribute("data-file-name"));
                stopPlayback();
            }
        });

        // Show or hide the question mark for a scan result that may be the wrong song

        // Save all

        {

        // Every song in the list with its metadata, for main to save

        // Export modal: moves every song in the list (saved or not) to a folder, Apple Music's import folder by default.
        // The folder is remembered between launches
        var exportDialog = document.getElementById("exportDialog");

        function setExportStatus(text, color = "")
        {
            var status = document.getElementById("exportDialogStatus");

            status.style.color = color;

        // Show the folder like Finder does: home folder as ~, without macOS' hidden ".localized" endings. Full path on hover
        function showExportFolder()

            var shown = exportFolder.startsWith(home) ? "~" + exportFolder.slice(home.length) : exportFolder;
            document.getElementById("exportFolderPath").textContent = shown.replace(/\.localized(?=[\/\\]|$)/g, "");

        async function exportSongs()
        {
            if (document.getElementById("downloadLogo").classList.contains("mdi-spin"))

                errorMessage("Download in progress!");
                return;
            }

            var count = folderFiles.children.length;

                errorMessage("No songs to export!");

            showExportFolder();

                `${count == 1 ? "Moves the 1 song" : `Moves all ${songCount(count)}`} out of KDL into this folder. Click it to choose a different one.`;

        async function chooseExportFolder()

        async function confirmExport()
        {
            var exportButton = document.getElementById("exportDialogExport");

            stopPlayback();
            exportButton.disabled = true;

            {
                setExportStatus(result.error, "var(--danger)");

        // Delete all
        // Ask before doing something that can't be undone. Resolves true if confirmed.
        // Cancel has focus, so Enter or Escape won't confirm by accident
        function confirmDialog(title, text, confirmLabel, confirmClass = "btn-danger")
        {
            var dialog = document.getElementById("confirmDialog");
            var confirmButton = document.getElementById("confirmDialogConfirm");
            var cancelButton = document.getElementById("confirmDialogCancel");
            document.getElementById("confirmDialogTitle").textContent = title;
            document.getElementById("confirmDialogText").textContent = text;
            confirmButton.textContent = confirmLabel;
            confirmButton.className = "btn " + confirmClass;

            return new Promise(resolve =>
            {
                function close(confirmed)
                {
                    dialog.style.display = "none";
                    document.removeEventListener("keydown", onKeydown);
                    resolve(confirmed);
                }
                function onKeydown(event)
                {
                    if (event.key == "Escape") close(false);
                }

                confirmButton.onclick = () => close(true);
                cancelButton.onclick = () => close(false);
                dialog.onclick = (event) => { if (event.target == dialog) close(false); };
                document.addEventListener("keydown", onKeydown);

                dialog.style.display = "";
                cancelButton.focus();
            });
        }

        // How many songs the delete was for, for its result message

        spotifySearch.addEventListener("keypress", function(event)
        {
            if (event.key == "Enter")
            {
                searchSpotify();
            }
        });

        // Show spotify image when it has a src
        spotifyImage.addEventListener("load", function()
        {
            spotifyImage.style.visibility = "visible";
        });

        // Send request
        function searchSpotify()
        {
            // Show loading elements
            document.getElementById("spotifyLogo").classList.add("mdi-spin");
            spotifyResults.innerHTML = "";
            spotifyResults.innerHTML +=
            `<div class="row mb-3">
                <div class="col-2">
                    <img src="" width="65" height="65">
                </div>
                <div class="col-10" style="white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                    Title: </br>
                    Artist: </br>
                    Album: </br>
                </div>
            </div>`;

            ipc.send("searchSong", spotifySearch.value);
        }

        // Spotify credentials dialog
        var credentialsDialog = document.getElementById("credentialsDialog");
        var credentialsClientId = document.getElementById("credentialsClientId");
        var credentialsClientSecret = document.getElementById("credentialsClientSecret");
        var credentialsStatus = document.getElementById("credentialsStatus");

        // Show a line under the fields, red for problems, green when it worked
        function setCredentialsStatus(text, color = "")
        {
            credentialsStatus.textContent = text;
            credentialsStatus.style.color = color;
        }

        // Open with the saved credentials filled in, the secret masked until its eye is clicked.
        // message explains why it opened by itself (e.g. a search needed credentials)
        async function openCredentialsDialog(message = "")
        {
            var saved = await ipc.invoke("getSpotifyCredentials");
            credentialsClientId.value = saved.clientId;
            credentialsClientSecret.value = saved.clientSecret;
            credentialsClientSecret.type = "password";
            document.getElementById("credentialsSecretEye").className = "mdi mdi-eye";
            setCredentialsStatus(message, message ? "var(--danger)" : "");

            credentialsDialog.style.display = "";
            (credentialsClientId.value ? credentialsClientSecret : credentialsClientId).focus();
        }

        function closeCredentialsDialog()
        {
            credentialsDialog.style.display = "none";
        }

        // Main checks them with spotify and only saves them if they work
        async function saveCredentials()
        {
            var saveButton = document.getElementById("credentialsSaveButton");
            setCredentialsStatus("Checking with Spotify...");
            saveButton.disabled = true;

            var result = await ipc.invoke("saveSpotifyCredentials", credentialsClientId.value, credentialsClientSecret.value);
            saveButton.disabled = false;

            if (result.ok)
            {
                closeCredentialsDialog();
                successMessage("Credentials saved!");
            }
            else
            {
                setCredentialsStatus(result.message, "var(--danger)");
            }
        }

        function toggleSecretVisible()
        {
            var showing = credentialsClientSecret.type == "text";
            credentialsClientSecret.type = showing ? "password" : "text";
            document.getElementById("credentialsSecretEye").className = showing ? "mdi mdi-eye" : "mdi mdi-eye-off";
        }

        // Open in the normal browser, not inside the app window
        function openSpotifyDashboard()
        {
            require("electron").shell.openExternal("https://developer.spotify.com/dashboard");
        }

        // Enter saves, Escape closes
        [credentialsClientId, credentialsClientSecret].forEach(input => input.addEventListener("keydown", function(event)
        {
            if (event.key == "Enter") saveCredentials();
        }));
        document.addEventListener("keydown", function(event)
        {
            if (event.key == "Escape" && credentialsDialog.style.display != "none") closeCredentialsDialog();
        });

        // A search or scan needed credentials (missing or rejected), so ask for them.
        // Scans send this once per song, so only open it if it isn't open already
        ipc.on("spotifyCredentialsNeeded", function(event, message)
        {
            if (credentialsDialog.style.display == "none")
            {
                openCredentialsDialog(message);
            }
        });

        // App updates. Main checks GitHub for a new release and downloads it in the background
        var appUpdate = null;
        ipc.on("appUpdate", function(event, update)
        {
            appUpdate = update;
            var button = document.getElementById("appUpdateButton");
            button.title = update.status == "ready" ? `KDL ${update.version} is ready, click to restart and update`
                                                    : `KDL ${update.version} is available, click to download it`;
            button.style.display = "";
        });

        async function installAppUpdate()
        {
            if (appUpdate.status != "ready")
            {
                var text = (appUpdate.reason ? appUpdate.reason + ". " : "") + "Download the new version from GitHub?";
                if (await confirmDialog(`KDL ${appUpdate.version} is available`, text, "Download", "btn-primary"))
                {
                    require("electron").shell.openExternal(appUpdate.url);
                }
                return;
            }

            var text = "KDL restarts to update. It also updates by itself the next time you quit it.";
            if (document.getElementById("downloadLogo").classList.contains("mdi-spin"))
            {
                text += " The download in progress will be stopped.";
            }
            if (await confirmDialog(`KDL ${appUpdate.version} is ready`, text, "Restart", "btn-primary"))
            {
                ipc.send("installAppUpdate");
            }
        }
    </script>
</html>
