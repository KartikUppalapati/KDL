<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>KDL</title>
        <meta charset="utf-8" />
        <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"/> -->
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <!-- GOOGLE FONTS -->
        <link type="text/css" href="plugins/material/css/materialdesignicons.min.css" rel="stylesheet"/>
        <link type="text/css" href="plugins/simplebar/simplebar.css" rel="stylesheet"/>

        <!-- MONO CSS -->
        <link type="text/css" href="index.css" id="main-css-href" rel="stylesheet"/>

        <!-- FAVICON -->
        <!-- <link href="images/favicon.png" rel="shortcut icon"/> -->
        <script src="plugins/nprogress/nprogress.js"></script>
    </head>

    <body class="navbar-fixed" id="body">
        <div class="wrapper">
            <div class="page-wrapper">
                <!-- Top Navbar -->
                <header class="main-header" id="header">
                    <nav id="navbar" class="navbar navbar-expand-lg navbar-light">
                        <!-- Message Area -->
                        <div id="serverMessage" class="navbar-left">
                        </div>
                        
                        <!-- Profile Area -->
                        <div class="navbar-right">
                            <button class="nav nav-link button-hover" onclick="deleteSongs()">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-delete"></i></h5>
                            </button>
                            <button class="nav nav-link button-hover" onclick="scanSongs()">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-file-find"></i></h5>
                            </button>
                            <button class="nav nav-link button-hover" onclick="saveSongs()">
                                <h5 style="font-weight: bold;"><i class="mdi mdi-24px mdi-content-save"></i></h5>
                            </button>
                        </div>
                    </nav>
                </header>

                <!-- Dashboard Areas -->
                <div class="content-wrapper">
                    <div class="content" style="height: 100%;">
                        <div id="homeArea" style="height: 100%;">
                            <div class="row" style="height: 100%;">
                                <!-- Folder Area -->
                                <div class="col-4">
                                    <div class="card card-default" style="height: 95%;">
                                        <div class="card-body mt-1">
                                            <!-- Folder Path -->
                                            <div class="input-group mb-0">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text">
                                                        <i class="mdi mdi-folder-open" style="cursor: pointer;" onclick="openSongsFolder()"></i>
                                                    </span>
                                                </div>
                                                <input id="folderPath" class="form-control"
                                                style="pointer-events: none;" type="text">
                                            </div>

                                            <!-- File List -->
                                            <div class="row mt-3" style="height: 97%;">
                                                <div class="col-12">
                                                    <div id="folderFiles" style="height: 62vh; overflow-y: auto;">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Spotify Area -->
                                <div class="col-5">
                                    <div class="card card-default" style="height: 95%;">
                                        <div class="card-body mt-1">
                                            <!-- Song Metadata -->
                                            <div class="row" style="height: 35%;">
                                                <!-- Album Image -->
                                                <div class="col-5">
                                                    <div>
                                                        <img id="spotifyImage" src="" width="145" height="145">
                                                    </div>
                                                </div>

                                                <!-- Title, Artist, Album -->
                                                <div class="col-7">
                                                    <div class="card-default" style="height: 95%;">
                                                        <!-- Title -->
                                                        <div class="input-group mb-1">
                                                            <div class="input-group-prepend">
                                                                <span class="input-group-text">
                                                                    <i class="mdi mdi-music"></i>
                                                                </span>
                                                            </div>
                                                            <input id="spotifyTitle" class="form-control" type="text">
                                                        </div>

                                                        <!-- Artist -->
                                                        <div class="input-group mb-1">
                                                            <div class="input-group-prepend">
                                                                <span class="input-group-text">
                                                                    <i class="mdi mdi-account"></i>
                                                                </span>
                                                            </div>
                                                            <input id="spotifyArtist" class="form-control" type="text">
                                                        </div>

                                                        <!-- Album -->
                                                        <div class="input-group mb-1">
                                                            <div class="input-group-prepend">
                                                                <span class="input-group-text">
                                                                    <i class="mdi mdi-album"></i>
                                                                </span>
                                                            </div>
                                                            <input id="spotifyAlbum" class="form-control" type="text">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Spotify Search -->
                                            <div class="input-group mb-0">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text">
                                                        <i id="spotifyLogo" class="mdi mdi-spotify"></i>
                                                    </span>
                                                </div>
                                                <input id="spotifySearch" class="form-control"  type="text">
                                            </div>

                                            <!-- Spotify Results -->
                                            <div class="row mt-3 mb-3" style="height: 57%;">
                                                <div class="col-12">
                                                    <div id="spotifyResults" style="height: 37vh; overflow-y: auto;">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Download Area -->
                                <div class="col-3">
                                    <div class="card card-default" style="height: 95%;">
                                        <div class="card-body mt-1">
                                            <!-- Video Link -->
                                            <div class="input-group mb-0">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text">
                                                        <i id="downloadLogo" class="mdi mdi-download"></i>
                                                    </span>
                                                </div>
                                                <input id="downloadLink" class="form-control" type="text">
                                            </div>

                                            <!-- Console Log -->
                                            <div class="row mt-3 mb-3" style="height: 97%;">
                                                <div class="col-12">
                                                    <div id="downloadLogs" style="height: 60vh; overflow-y: auto;">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script>
        // Init stuff
        var fileCount = 0;
        var msgDivMsg = null;
        var asyncFunctionTimeout = 200;
        var currentDashboard = "homeArea";
        var ipc = require("electron").ipcRenderer;
        var currentProfileButton = "profileInfoButton";
        var folderPath = document.getElementById("folderPath");
        var folderFiles = document.getElementById("folderFiles");
        var downloadLink = document.getElementById("downloadLink");
        var downloadLogs = document.getElementById("downloadLogs");
        var spotifyImage = document.getElementById("spotifyImage");
        var spotifyTitle = document.getElementById("spotifyTitle");
        var spotifyAlbum = document.getElementById("spotifyAlbum");
        var spotifyArtist = document.getElementById("spotifyArtist");
        var spotifySearch = document.getElementById("spotifySearch");
        var spotifyResults = document.getElementById("spotifyResults");

        // Get files in default folder path
        ipc.send("getFolderPath", {});

        // Hide spotify image initially
        spotifyImage.style.visibility = "hidden";

        // Display success message
        function successMessage(text)
        {
            // Create divs
            var msgDiv = document.getElementById("serverMessage");
            var msg = document.createElement("div");
            msg.setAttribute("class", "successMessage");
            msg.appendChild(document.createTextNode("Success! " + text));
            
            // Remove prev message
            try
            {
                msgDiv.removeChild(msgDivMsg);
            }
            catch (error) {}
            
            msgDiv.appendChild(msg);
            msgDivMsg = msg;

            // Clear message
            setTimeout(function ()
            {
                msgDiv.removeChild(msg);
            }, 1500);
        };

        // Display error message
        function errorMessage(text)
        {
            // Create divs
            var msgDiv = document.getElementById("serverMessage");
            var msg = document.createElement("div");
            msg.setAttribute("class", "errorMessage");
            msg.appendChild(document.createTextNode("Error! " + text));

            // Remove prev message
            try
            {
                msgDiv.removeChild(msgDivMsg);
            }
            catch (error) {}
            
            msgDiv.appendChild(msg);
            msgDivMsg = msg;

            // Clear message
            setTimeout(function ()
            {
                msgDiv.removeChild(msg);
            }, 1500);
        };

        // Update profile header
        function updateProfileHeader()
        {
            // Set profile header
            document.getElementById("userProfileName").innerHTML = tutorData["FirstName"] + " " + tutorData["LastName"];
            document.getElementById("userProfileEmail").innerHTML = tutorData["Email"];
            document.getElementById("userProfilePhone").innerHTML = tutorData["PhoneNumber"];
        }

        // Recieve user selected folder path
        ipc.on("getFolderPathReply", function(event, folderFullPath)
        {
            folderPath.value = folderFullPath;
            ipc.send("getFilesInFolder", folderFullPath);
        });

        // Get list of files in folder
        ipc.on("getFilesInFolderReply", function(event, files)
        {
            // Set length
            fileCount = files.length;

            // Clear text area
            folderFiles.innerHTML = "";

            // Go through list of files and add to text area
            for (let i = 0; i < files.length; i++) 
            {
                folderFiles.innerHTML +=
                `<div id="song${i}" class="mb-3">
                    <div style="white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                        ${files[i]}
                    </div>
                    <div class="row" data-file-name="${files[i]}"
                    data-song-image="" data-song-title="" data-song-artist="" data-song-album="">
                        <div style="padding-left: 15px;">
                            <img src="" width="65" height="65">
                        </div>
                        <div class="col-6" style="white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                            Title: </br>
                            Artist: </br>
                            Album: </br>
                        </div>
                        <div class="col-3">
                            </br>
                            <a onclick="copySongToTrack(this.parentElement.parentElement)" style="cursor: pointer;">
                                <i class="mdi mdi-content-copy text-primary"></i>
                            </a>
                            <a onclick="selectTrack(this.parentElement.parentElement)" style="cursor: pointer;">
                                <i class="mdi mdi-chevron-double-right text-dark"></i>
                            </a>
                        </div>
                    </div>
                </div>`;
            }

            // Get metadata for songs
            if (files.length > 0)
            {
                scanSongs();
            }
        });

        // Append download output 
        ipc.on("downloadOutput", function(event, output)
        {
            downloadLogs.innerHTML += `<p style="font-size: 13px">${output}</p>`;
            downloadLogs.scrollTop = downloadLogs.scrollHeight;
        });

        // Recieve download completed
        ipc.on("downloadCompleted", function(event, code)
        {
            // Stop spinner
            document.getElementById("downloadLogo").classList.remove("mdi-spin");

            if (code == 0)
            {
                successMessage("Download Completed!");
                ipc.send("getFolderPath", {});
            }
            else
            {
                errorMessage("Download Failed!");
            }
        });

        // Receive song search results
        ipc.on("songSearchResults", function(event, songResultList)
        {
            // Clear html on each new search
            spotifyResults.innerHTML = "";
            document.getElementById("spotifyLogo").classList.remove("mdi-spin");

            // Go through all tracks in response
            for (let i = 0; i < songResultList.tracks.items.length; i++)
            {
                // Get individual response song's meta data and push into list data
                var songMetaData = 
                {
                    "songName": songResultList.tracks.items[i].name,
                    "albumName": songResultList.tracks.items[i].album.name,
                    "artistName": songResultList.tracks.items[i].artists[0].name,
                    "albumImage": songResultList.tracks.items[i].album.images[0].url
                }

                // Create and add song's html for text box
                spotifyResults.innerHTML +=
                `<div class="row mb-3 button-hover" onclick="selectSong(this)" style="cursor: pointer;">
                    <div class="col-2">
                        <img src="${songMetaData.albumImage}" width="65" height="65">
                    </div>
                    <div class="col-10" style="white-space: nowrap;">
                        Title: ${songMetaData.songName}</br>
                        Artist: ${songMetaData.artistName}</br>
                        Album: ${songMetaData.albumName}</br>
                    </div>
                </div>`;
            }
        });

        // Receive song scan result
        ipc.on("songScanResult", function(event, songResults, index)
        {
            // Use only most relevant result
            var songMetaData =
            {
                "songName": songResults.tracks.items[0].name,
                "albumName": songResults.tracks.items[0].album.name,
                "artistName": songResults.tracks.items[0].artists[0].name,
                "albumImage": songResults.tracks.items[0].album.images[0].url
            }

            // Get song div
            child = folderFiles.children[index];
            var songDiv = child.children[1];

            // Set song metadata fields
            songDiv.setAttribute("data-song-image", songMetaData.albumImage);
            songDiv.setAttribute("data-song-title", songMetaData.songName);
            songDiv.setAttribute("data-song-artist", songMetaData.artistName);
            songDiv.setAttribute("data-song-album", songMetaData.albumName);

            songDiv.children[0].getElementsByTagName("img")[0].src = songMetaData.albumImage;
            songDiv.children[1].innerHTML =
            `Title: ${songMetaData.songName}</br>
            Artist: ${songMetaData.artistName}</br>
            Album: ${songMetaData.albumName}</br>`;
        });

        // Receive songs saved response
        ipc.on("songsSavedResponse", function(event, successResponse)
        {
            if (successResponse == 0)
            {
                successMessage("Files saved!");
            }
            else
            {
                errorMessage("Files not saved!");
            }
        });

        // Receive song search failure
        ipc.on("songSearchFail", function(event, message)
        {
            // Show fail
            spotifyResults.innerHTML = "";
            document.getElementById("spotifyLogo").classList.remove("mdi-spin");
            errorMessage(message);
        });

        // Receive song search failure
        ipc.on("songScanFail", function(event, message)
        {
            // Show fail
            errorMessage(message);
        });

        // Receive songs delete response
        ipc.on("deleteAllSongsResponse", function(event, successResponse)
        {
            if (successResponse == 0)
            {
                successMessage("All songs deleted.");
                folderFiles.innerHTML = "";
            }
            else            {
                errorMessage("Couldn't delete songs!");
            }
        });

        // Save songs metadata
        function saveSongs()
        {
            var fileList = [];
            for (let i = 0; i < folderFiles.children.length; i++)
            {
                fileList.push(
                {
                    "songFullFileName": folderPath.value + "/" + folderFiles.children[i].children[1].getAttribute("data-file-name"),
                    "albumImage": folderFiles.children[i].children[1].getAttribute("data-song-image"),
                    "songName": folderFiles.children[i].children[1].getAttribute("data-song-title"),
                    "artistName": folderFiles.children[i].children[1].getAttribute("data-song-artist"),
                    "albumName": folderFiles.children[i].children[1].getAttribute("data-song-album"),
                });
            }

            if (fileList.length == 0)
            {
                errorMessage("No files to save!");
            }
            else
            {
                ipc.send("saveSongs", fileList);
            }
        }

        // Get metadata for songs
        function scanSongs()
        {
            if (folderFiles.children.length == 0)
            {
                errorMessage("No files to scan!");
                return;
            }

            for (let i = 0; i < folderFiles.children.length; i++)
            {
                // Get song div
                child = folderFiles.children[i];
                var songDiv = child.children[1];

                // Clean song name for spotify search
                var cleanedSongName = songDiv.getAttribute("data-file-name").replace(".mp3", "")
                cleanedSongName = cleanedSongName.replace('{', '(');
                cleanedSongName = cleanedSongName.replace('}', '(');
                cleanedSongName = cleanedSongName.replace('[', '(');
                cleanedSongName = cleanedSongName.replace(']', ')');
                while (cleanedSongName.includes("(")) 
                {
                    cleanedSongName = cleanedSongName.replace(/ *\([^)]*\) */g, "");
                }

                ipc.send("scanSong", cleanedSongName, i);
            }
        }

        // Delete songs from folder
        function deleteSongs()
        {
            ipc.send("deleteAllSongs", {});
        }

        // Open songs folder
        function openSongsFolder()
        {
            if (folderPath.value != "")
            {
                ipc.send("openSongsFolder", {});
            }
            else
            {
                errorMessage("No folder selected!");
            }
        }

        // Select song from spotify area
        function selectSong(songDiv)
        {
            trackMetaData = songDiv.children[1].innerHTML.split("<br>");
            spotifyImage.src = songDiv.children[0].getElementsByTagName("img")[0].src;
            spotifyTitle.value = trackMetaData[0].trim().replace("Title: ", "").replace("&amp;", "&");
            spotifyArtist.value = trackMetaData[1].trim().replace("Artist: ", "").replace("&amp;", "&");
            spotifyAlbum.value = trackMetaData[2].trim().replace("Album: ", "").replace("&amp;", "&");
        }

        // Select track from folder area
        function selectTrack(songDiv)
        {
            // Clean song name for spotify search
            var cleanedSongName = songDiv.getAttribute("data-file-name").replace(".mp3", "")
            cleanedSongName = cleanedSongName.replace('{', '(');
            cleanedSongName = cleanedSongName.replace('}', '(');
            cleanedSongName = cleanedSongName.replace('[', '(');
            cleanedSongName = cleanedSongName.replace(']', ')');
            while (cleanedSongName.includes("(")) 
            {
                cleanedSongName = cleanedSongName.replace(/ *\([^)]*\) */g, "");
            }

            // Set song metadata fields
            spotifyImage.src = songDiv.getAttribute("data-song-image")
            spotifyTitle.value = songDiv.getAttribute("data-song-title");
            spotifyArtist.value = songDiv.getAttribute("data-song-artist");
            spotifyAlbum.value = songDiv.getAttribute("data-song-album");
            spotifySearch.value = cleanedSongName;
            searchSpotify();
        }

        // Copy song metadata to track
        function copySongToTrack(songDiv)
        {
            songDiv.setAttribute("data-song-image", spotifyImage.src);
            songDiv.setAttribute("data-song-title", spotifyTitle.value);
            songDiv.setAttribute("data-song-artist", spotifyArtist.value);
            songDiv.setAttribute("data-song-album", spotifyAlbum.value);

            songDiv.children[0].getElementsByTagName("img")[0].src = spotifyImage.src;
            songDiv.children[1].innerHTML =
            `Title: ${spotifyTitle.value}</br>
            Artist: ${spotifyArtist.value}</br>
            Album: ${spotifyAlbum.value}</br>`;
        }

        // Function to run when profile settings item is clicked
        function profileMenuNav(buttonToMakeActive, elementsToMakeVisible, functionToRun)
        {
            // Get admin body area
            var profileBodyArea = document.getElementById("profileBodyArea");
            document.getElementById(currentProfileButton).className = "nav-link";
            document.getElementById(buttonToMakeActive).className = "nav-link active";
            currentProfileButton = buttonToMakeActive;

            // Go through children
            for (let i = 0; i < profileBodyArea.children.length; i++)
            {
                if (elementsToMakeVisible.includes(i))
                {
                    profileBodyArea.children[i].style.display = "block";
                }
                else
                {
                    profileBodyArea.children[i].style.display = "none";
                }
            }

            // Run function
            setTimeout(function() {window[functionToRun]();}, asyncFunctionTimeout);
        }

        // Function to run when menu item is clicked
        function menuNav(dashboardName, functionToRun)
        {
            // Hide old dashboard show new and adjust current dashboard var accordingly
            document.getElementById(currentDashboard).style.display = "none";
            document.getElementById(dashboardName).style.display = "block";
            currentDashboard = dashboardName;

            // Run function
            setTimeout(function() {window[functionToRun]();}, asyncFunctionTimeout);
        }
    
        // Function listener for enter on download link
        downloadLink.addEventListener("keypress", function(event)
        {
            if (event.key == "Enter") 
            {
                downloadLogs.innerHTML = "";
                document.getElementById("downloadLogo").classList.add("mdi-spin");
                ipc.send("downloadFromLink", downloadLink.value);
            }
        });

        // Function listerner for enter on spotify search
        spotifySearch.addEventListener("keypress", function(event)
        {
            if (event.key == "Enter")
            {
                searchSpotify();
            }
        });

        // Show spotify image when it has a src
        spotifyImage.addEventListener("load", function()
        {
            spotifyImage.style.visibility = "visible";
        });

        // Search spotify
        function searchSpotify()
        {
            spotifyResults.innerHTML = "";
            spotifyResults.innerHTML +=
            `<div class="row mb-3">
                <div class="col-2">
                    <img src="" width="65" height="65">
                </div>
                <div class="col-10" style="white-space: nowrap;">
                    Title: </br>
                    Artist: </br>
                    Album: </br>
                </div>
            </div>`;

            document.getElementById("spotifyLogo").classList.add("mdi-spin");
            ipc.send("searchSong", spotifySearch.value);
        }
    </script>
</html>
